{% extends "base.html" %}

{% load static %}




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Coding Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
</head>
<body>

    {% block content %}
    <style>
        body {
            background-color: #f8f9fa;
        }
        .quiz-container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
        }
        .question-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.1);
        }
        .btn-submit {
            background-color: #007bff;
            color: white;
            padding: 12px;
            font-size: 18px;
            border-radius: 8px;
            width: 100%;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .form-check-input:checked {
            background-color: #007bff;
            border-color: #007bff;
        }
        h2 {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>

    <div class="container mt-5">
        <div class="quiz-container">
            <h2>💡 Coding Quiz</h2>
            <form action="{% url 'check_answer' %}" method="POST">
                {% csrf_token %}
                

                {% for question in questions %}
                <div class="question-card">
                    <h5><strong>Q{{ forloop.counter }}.</strong> {{ question.question }}</h5>
                    <input type="hidden" name="num_questions" value="{{ num_questions }}">
                <input type="hidden" name="category_id" value="{{ category_id }}">
                <input type="hidden" name="difficulty" value="{{ difficulty }}">
                    
                    <input type="hidden" name="question_{{ forloop.counter }}" value="{{ question.question }}">
                    <input type="hidden" name="correct_answer_{{ forloop.counter }}" value="{{ question.correct_answer }}">

                    {% for option in question.shuffled_options %}
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="selected_answer_{{ forloop.parentloop.counter }}" value="{{ option }}" required>
                            <label class="form-check-label">{{ option }}</label>
                        </div>
                    {% endfor %}
                </div>
                {% endfor %}

                <button type="submit" class="btn btn-submit mt-3">🚀 Submit Answers</button>
            </form>
        </div>
    </div>
    {% endblock %}

</body>
</html>
